<p-panel>
    <ng-template pTemplate="header">
        <span class="font-medium w-full text-center"
            >Por favor, seleccione el estudiante que se encuentra bajo su
            dirección</span
        >
    </ng-template>
    <ng-template pTemplate="content">
        <div class="flex justify-content-center mb-3 w-full">
            <button
                pButton
                icon="pi pi-plus"
                label="Crear Examen de Valoracion"
                (click)="onProcesoExamen()"
                [disabled]="!role.includes('ROLE_DOCENTE')"
            ></button>
        </div>
    </ng-template>
    <ng-template pTemplate="footer">
        <div
            class="col flex flex-column align-items-center justify-content-center w-full"
        >
            <div class="mb-3">
                <label class="mr-4" for="estadoSelect"
                    >Filtrar por estado:</label
                >
                <p-multiSelect
                    class="multiselect-custom-virtual-scroll"
                    [(ngModel)]="selectedEstados"
                    [options]="estados"
                    optionLabel="text"
                    itemSize="34"
                    [filter]="true"
                    [virtualScroll]="true"
                    [showToggleAll]="true"
                    selectedItemsLabel="{0} estados seleccionados"
                    (onChange)="onStateChange($event)"
                ></p-multiSelect>
            </div>
            <p-table
                [value]="solicitudes"
                [paginator]="true"
                [loading]="loading"
                [rows]="5"
                [tableStyle]="{ width: '100%', 'max-width': '80rem' }"
                [showCurrentPageReport]="true"
                [scrollable]="true"
                currentPageReportTemplate="{first} - {last} de {totalRecords}"
            >
                <ng-template pTemplate="header">
                    <tr>
                        <th scope="col" style="min-width: 200px">
                            Identificacion
                        </th>
                        <th scope="col" style="min-width: 200px">
                            Nombre Completo
                        </th>
                        <th scope="col" style="min-width: 200px">
                            Correo Electronico
                        </th>
                        <th scope="col" style="min-width: 200px">Estado</th>
                        <th scope="col" style="min-width: 200px">Opciones</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-solicitud>
                    <tr>
                        <td style="min-width: 200px">
                            {{ solicitud.identificacion }}
                        </td>
                        <td style="min-width: 200px">
                            {{ solicitud.nombreCompleto }}
                        </td>
                        <td style="min-width: 200px">
                            {{ solicitud.correoElectronico }}
                        </td>
                        <td style="min-width: 200px">{{ solicitud.estado }}</td>
                        <td style="min-width: 200px">
                            <button
                                pButton
                                pTooltip="Editar"
                                type="button"
                                icon="pi pi-pencil"
                                class="p-button-rounded p-button-text p-button-warning"
                                (click)="
                                    onEditar(
                                        solicitud.id,
                                        solicitud.estudianteId
                                    )
                                "
                            ></button>
                            <button
                                *ngIf="
                                    role.includes('ROLE_ESTUDIANTE')
                                        ? false
                                        : true
                                "
                                pButton
                                pTooltip="Eliminar"
                                type="button"
                                icon="pi pi-trash"
                                class="p-button-rounded p-button-text p-button-danger"
                                (click)="onDelete($event, solicitud.id)"
                            ></button>
                            <p-confirmPopup></p-confirmPopup>
                        </td>
                    </tr>
                </ng-template>
                <!-- Mensaje sin registros -->
                <ng-template pTemplate="emptymessage" let-columns>
                    <tr>
                        <td [attr.colspan]="6">No se encontraron registros</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </ng-template>
</p-panel>
